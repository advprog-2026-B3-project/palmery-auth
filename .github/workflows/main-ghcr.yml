name: Main GHCR Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.repository_owner }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: Normalize owner name
        id: owner
        run: echo "value=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push auth backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-auth-backend:main
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-auth-backend:main-${{ github.sha }}

      - name: Build and push auth frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_AUTH_API_BASE_URL=https://api-auth.palmery.my.id
            NEXT_PUBLIC_ALLOWED_RETURN_ORIGINS=https://palmery.my.id
            NEXT_PUBLIC_APP_CALLBACK_URL=https://palmery.my.id/auth/callback
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-auth-frontend:main
            ghcr.io/${{ steps.owner.outputs.value }}/palmery-auth-frontend:main-${{ github.sha }}

      - name: Trigger infra deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          repository: advprog-2026-B3-project/palmery-infra
          event-type: deploy-main
          client-payload: >-
            {"source_repository":"${{ github.repository }}","source_sha":"${{ github.sha }}"}
