name: CI SonarCloud

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Frontend install + build + test
        working-directory: frontend
        run: |
          pnpm install --no-frozen-lockfile
          pnpm test
          # Fix paths in lcov.info to be relative to root
          sed -i 's|SF:|SF:frontend/|g' coverage/lcov.info
          pnpm build

      - name: Backend Gradle Test + Coverage Report
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport --no-daemon

      - name: Validate SonarCloud Configuration
        run: |
          if [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "::error::Missing GitHub secret SONAR_PROJECT_KEY"
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo "::error::Missing GitHub secret SONAR_ORGANIZATION"
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Missing GitHub secret SONAR_TOKEN"
            exit 1
          fi

      - name: Sonar Vulnerability Gate (PR)
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          set -euo pipefail
          query="pullRequest=${{ github.event.pull_request.number }}"
          response=$(curl -sS -u "${SONAR_TOKEN}:" \
            "${SONAR_HOST_URL}/api/issues/search?componentKeys=${SONAR_PROJECT_KEY}&types=VULNERABILITY&resolved=false&ps=1&${query}")
          api_errors=$(echo "${response}" | jq '.errors | length // 0')
          if [ "${api_errors}" -gt 0 ]; then
            echo "Sonar API returned errors:"
            echo "${response}" | jq -c '.errors'
            exit 1
          fi
          total=$(echo "${response}" | jq -r '.total // 0')
          echo "Sonar unresolved vulnerabilities: ${total}"
          [ "${total}" -eq 0 ]

      - name: SonarCloud Quality Gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }} -Dsonar.organization=${{ env.SONAR_ORGANIZATION }} -Dsonar.projectName=palmery-auth -Dsonar.host.url=https://sonarcloud.io -Dsonar.sourceEncoding=UTF-8 -Dsonar.sources=backend/src/main,frontend -Dsonar.tests=backend/src/test,frontend -Dsonar.test.inclusions=backend/src/test/**/*,frontend/**/*.test.ts,frontend/**/*.test.tsx -Dsonar.exclusions=**/*.test.ts,**/*.test.tsx,**/.next/**,**/node_modules/**,**/build/** -Dsonar.coverage.exclusions=frontend/app/**,frontend/components/ui/** -Dsonar.java.binaries=backend/build/classes/java/main -Dsonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info -Dsonar.qualitygate.wait=true
